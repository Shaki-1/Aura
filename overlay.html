<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURA Overlay</title>
  <link rel="stylesheet" href="overlay.css">
</head>
<body class="overlay-voyager">
  <main class="overlay-root" aria-label="AURA accessibility overlay">
    <div class="filter-layer"></div>
    <div class="edge-frame"></div>
    <div class="enforcement-area-layer" id="enforcementAreaLayer" aria-hidden="true"></div>
    <div id="readingAreaFrame" class="reading-area-frame" aria-hidden="true">
      <span>Reading area</span>
    </div>

    <aside class="overlay-status" aria-label="AURA overlay status">
      <p>AURA active</p>
      <p><span id="overlayStatus">Waiting</span></p>
      <p>Mode: <span id="overlayMode">Voyager</span></p>
      <p>Profile: <span id="overlayProfile">Default Accessibility Profile</span></p>
      <p id="overlayAppRow">App: <span id="overlayApp">Waiting</span></p>
    </aside>
  </main>

  <script src="overlay.js"></script>
</body>
</html>
